<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create a character</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#0b0b0b;--pink:#ff3fb4;--purple:#8a3fc0;--line:#2a2a2a;--txt:#fff;--mut:#9a9a9a;
--font:Manrope,"Segoe UI",Arial,sans-serif;
/* type scale */
--fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:18px;--fs-xl:20px;--fs-2xl:24px;--fs-3xl:32px;--fs-price:44px;
--lh-h:1.15;--lh-b:1.4;--lh-t:1.5;
/* spacing scale */
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
--w:560px}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:var(--fs-md);line-height:var(--lh-b);min-height:100dvh;-webkit-user-select:none;user-select:none}
button,input{font-family:inherit}
button{touch-action:manipulation}
.ico{width:1em;height:1em;display:block;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.f{fill:currentColor;stroke:none}
.rd .ico,.cb .ico,.perks li i .ico{stroke-width:3}
.bi .ico{stroke-width:1.8}
.wrap{position:relative;max-width:1100px;margin:0 auto;padding:0 var(--s4) 120px}

/* header */
.promo{display:flex;justify-content:center;margin-bottom:var(--s2)}
.promo span{background:linear-gradient(90deg,#4f46e5,#8a3fc0);border:1px solid #7c3aed;border-radius:0 0 10px 10px;padding:var(--s2) var(--s4);font-weight:700;font-size:var(--fs-xs)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:var(--s4)}
.top button{display:flex;align-items:center;justify-content:center;flex:0 0 48px;padding:0;background:none;border:0;color:#fff;font-size:var(--fs-2xl);cursor:pointer;width:48px;height:48px;border-radius:50%}
.top button:active{background:#1c1c1c}
.top h1{flex:1;min-width:0;padding:0 var(--s2);margin:0;text-align:center;font-size:var(--fs-lg);font-weight:600;line-height:var(--lh-h)}
.top h1.offer{display:flex;flex:0 1 var(--w);width:var(--w);margin:0 auto;align-items:center;justify-content:space-between;gap:var(--s2);padding:0;text-align:left;font-size:var(--fs-sm);font-weight:700}.obar{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);max-width:var(--w);min-height:56px;margin:0 auto;padding:8px 12px 8px 16px;border:1px solid rgba(255,63,180,.55);border-top:0;border-radius:0;background:linear-gradient(90deg,rgba(255,63,180,.22),rgba(138,63,192,.22));font-size:var(--fs-lg);font-weight:800}.obar .sale{color:#fff;white-space:nowrap}.obar .timer{padding:6px 12px;font-size:var(--fs-xl);border-radius:8px;background:linear-gradient(90deg,#ff45b5,#8a3fc0);color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}.obar+.pcards{position:relative;max-width:var(--w);aspect-ratio:100/80;margin:var(--s4) auto var(--s5);display:flex;justify-content:center;align-items:center}
.pc{position:absolute;border-radius:18px;background:#fff;padding:3px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.pc img{width:100%;height:100%;object-fit:cover;display:block;border-radius:15px}
.pc-l,.pc-r{padding:0;border:2px solid #fff;background:transparent;backface-visibility:hidden;outline:1px solid transparent;width:34%;aspect-ratio:3/4;top:50%;overflow:hidden}
.pc-l{left:-3%;transform:translateY(-50%) rotate(-8deg)}
.pc-r{right:-3%;transform:translateY(-50%) rotate(8deg)}
.pc-l img,.pc-r img{border-radius:0;filter:blur(3px);transform:scale(1.15)}
.pc .lk{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#ff4fc3;display:flex;align-items:center;justify-content:center}
.pc .lk svg{width:24px;height:24px}
.pc-m{z-index:2;width:50%;aspect-ratio:3/4;left:50%;top:50%;transform:translate(-50%,-50%);background:#ff6fcf;padding:10px;border-radius:26px;box-shadow:0 0 40px rgba(255,63,180,.55),0 8px 24px rgba(0,0,0,.5)}
.pc-in{position:relative;width:100%;height:100%;border-radius:16px;border:2px solid #fff;overflow:hidden}
.pc-in img{position:absolute;inset:0;border-radius:0;object-position:50% 20%}
.obar{border-radius:0 0 18px 18px}
.pc-l,.pc-r{cursor:pointer}
.pc .lk{animation:lkp 1.6s ease-in-out infinite}
@keyframes lkp{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(255,79,195,.6)}50%{opacity:.55;transform:scale(.92);box-shadow:0 0 0 10px rgba(255,79,195,0)}}
.phero{margin-top:0;border-radius:0 0 24px 24px;border:1px solid rgba(255,63,180,.55);border-top:0}
.top.pw{position:absolute;top:64px;left:var(--s4);right:var(--s4);max-width:var(--w);margin:0 auto;min-height:0;z-index:5;pointer-events:none}.top.pw button{pointer-events:auto;background:rgba(0,0,0,.45)}@media(min-width:600px){.top.pw{left:var(--s5);right:var(--s5)}}
.top h1.hero{font-size:var(--fs-2xl);font-weight:800}
h1.hero em{font-style:normal;color:var(--pink)}
.prog{display:flex;align-items:center;gap:var(--s1);margin:0 0 var(--s5)}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--pink)}
.prog b{font-size:var(--fs-sm);margin-left:var(--s2);white-space:nowrap}
h2{text-align:center;font-size:var(--fs-2xl);line-height:var(--lh-h);margin:0 0 var(--s5)}
h2.q0{font-size:var(--fs-lg);font-weight:400}
.ld{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:var(--s6)}
.ldr{width:88px;height:88px;border-radius:50%;border:6px solid #2a2a2a;border-top-color:#ff45b5;border-right-color:#8a3fc0;animation:ldspin 1s linear infinite;margin-bottom:var(--s5)}
@keyframes ldspin{to{transform:rotate(360deg)}}
.ld h2{margin-bottom:var(--s2)}
.ldm{color:var(--mut);font-size:var(--fs-md);min-height:24px;margin-bottom:var(--s5)}
.ldbar{width:100%;max-width:360px;height:8px;border-radius:999px;background:#222;overflow:hidden}
.ldbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff45b5,#8a3fc0)}
.ldp{margin-top:var(--s3);font-weight:700;font-size:var(--fs-sm)}
.ldcol{flex:1;max-width:var(--w);display:flex;flex-direction:column;gap:var(--s4)}
.ldcol .btn{flex:none;width:100%;max-width:none}
.ldmsg{position:relative;display:flex;align-items:center;gap:var(--s3);min-height:64px;margin-top:var(--s3);opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .4s ease}
.ldmsg.show{opacity:1;transform:none}
.ldmsg .av{position:relative;flex:0 0 56px;height:56px;border-radius:50%;background-color:#2a2a2a;background-size:150%;background-position:50% 0%;background-repeat:no-repeat}
.ldmsg .av::after{content:"";position:absolute;right:0;bottom:2px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid var(--bg)}
.ldmsg .bb{position:relative;flex:1;background:#fff;color:#111;border-radius:18px;padding:14px 16px;font-size:var(--fs-md);font-weight:500;line-height:1.3}
#ldmsg2{margin-top:-8px}
.ldmsg .tag{position:absolute;top:-13px;left:14px;background:#e55fc0;color:#fff;font-size:12px;font-weight:700;line-height:1;padding:5px 12px;border-radius:999px}
.choice-terms{max-width:var(--w);margin:var(--s6) auto 0;padding-top:var(--s5);color:#8f8f8f;text-align:center;font-size:11px;line-height:var(--lh-t)}.choice-terms a{color:inherit;text-underline-offset:2px}.choice-terms a:active{color:#fff}

/* step cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3);max-width:var(--w);margin:0 auto}
.c{position:relative;aspect-ratio:3/4;border-radius:18px;border:2px solid transparent;cursor:pointer;overflow:hidden;
background:radial-gradient(ellipse at 50% 70%,#4a1a78 0%,#1a0a2b 45%,#050505 80%);transition:transform .12s}
.c:active{transform:scale(.97)}
.c.sel{border-color:var(--pink);box-shadow:0 0 0 2px rgba(255,63,180,.25)}
.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.c video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;pointer-events:none}
.c .fig{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:58%;height:78%;
background:linear-gradient(#1d2a55,#0f1733);border-radius:50% 50% 0 0/38% 38% 0 0}
.c .fig:before{content:"";position:absolute;left:50%;top:-30%;width:46%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--sw,#c99a7a)}
.c .ic{position:absolute;top:var(--s3);left:0;right:0;text-align:center;font-size:var(--fs-3xl)}
.c span{position:absolute;bottom:0;left:0;right:0;padding:var(--s5) var(--s2) var(--s3);text-align:center;font-size:var(--fs-md);font-weight:600;line-height:var(--lh-b);background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:1}
.name{max-width:var(--w);margin:0 auto}
.name input{width:100%;height:56px;padding:0 var(--s4);border-radius:16px;border:1px solid var(--line);background:#141414;color:#fff;font-size:var(--fs-md);-webkit-user-select:text;user-select:text}
.name input:focus{outline:0;border-color:var(--pink)}
.voice{max-width:var(--w);margin:var(--s5) auto 0}
.voicel{color:#8f8f8f;font-size:var(--fs-sm);margin:0 0 var(--s2);text-align:center}
.voicerow{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.vo{height:56px;border-radius:16px;border:1px solid var(--line);background:#141414;color:#fff;font-size:var(--fs-md);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:var(--s2)}
.vo i{font-style:normal;font-size:.8em;opacity:.8}
.vo.sel{border-color:var(--pink);box-shadow:0 0 0 2px rgba(255,63,180,.25)}
.vo:active{filter:brightness(.9)}

/* bottom bar / buttons */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;gap:var(--s2)}
.btn{flex:1;max-width:var(--w);height:56px;border:0;border-radius:16px;color:#fff;font-size:var(--fs-lg);font-weight:600;cursor:pointer;background:linear-gradient(90deg,#ff45b5,#8a3fc0)}
.btn:active{filter:brightness(.9)}
.btn.ghost{flex:0 0 auto;width:auto;padding:0 var(--s5);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);font-size:var(--fs-xl);background:#1c1c1c;border:1px solid var(--line)}
.btn.ghost .ico{width:1.35em;height:1.35em}
.btn.ghost .ico.roll{animation:diceRoll .38s ease-in-out forwards;transform-origin:50% 50%;transform-box:fill-box}
@keyframes diceRoll{from{transform:rotate(0)}to{transform:rotate(-90deg)}}
.btn.ghost small{font-size:var(--fs-lg)}
#rnd{position:relative;isolation:isolate;overflow:hidden;transition:border-color .2s}
#rnd::before{content:"";position:absolute;inset:-1px;z-index:-1;background:linear-gradient(90deg,#ff45b5,#8a3fc0);opacity:0;transition:opacity .2s}
@media(hover:hover){#rnd:hover{border-color:transparent}#rnd:hover::before{opacity:1}}
.btn:disabled{opacity:.4;cursor:default}
.done{text-align:center;padding:var(--s5) 0}
.done .c{width:160px;margin:0 auto var(--s5)}
.sum{color:var(--mut);line-height:var(--lh-t);font-size:var(--fs-md)}

/* paywall */
h2.pw{font-size:var(--fs-3xl);line-height:var(--lh-h);margin-bottom:var(--s2)}
h2.pw em{font-style:normal;color:var(--pink)}
.sub{text-align:center;color:var(--mut);margin:0 0 var(--s5);font-size:var(--fs-md)}
.phero{position:relative;max-width:var(--w);margin:0 auto var(--s4);border-radius:24px;overflow:hidden;aspect-ratio:4/5;background:#0b0b0b}
.phero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.phero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,11,0) 35%,rgba(11,11,11,.75) 68%,#0b0b0b 100%)}
.ptxt{position:absolute;left:0;right:0;bottom:0;padding:0 var(--s5) var(--s5);z-index:1;text-align:left}
.ptxt h2.pw{text-align:left;margin:0 0 var(--s2);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.ptxt .sub{text-align:left;margin:0;color:#d0d0d0}
.laurels{max-width:var(--w);margin:0 auto var(--s5);display:flex;justify-content:center;align-items:center;gap:var(--s3)}
.laurels .lb{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.laurels .lf{flex:none;width:26px;height:52px}
.laurels .lf.r{transform:scaleX(-1)}
.laurels .lb span{font-size:var(--fs-md);font-weight:600;line-height:1.25;color:#b8b8b8;text-align:center}
.rdy{max-width:var(--w);margin:var(--s5) auto var(--s5);display:flex;flex-direction:column;align-items:center;gap:var(--s4)}
.rdy h2{margin:0}
.rdy h2 em{font-style:normal;color:var(--pink)}
.rdy .btn{flex:none;width:100%}
.plans{scroll-margin-top:var(--s4);max-width:var(--w);margin:0 auto var(--s5)}
.plan{border:2px solid var(--line);border-radius:20px;background:#141414;margin-bottom:var(--s3);cursor:pointer;overflow:hidden;transition:box-shadow .15s}
.plan.sel{border-color:var(--pink);box-shadow:0 0 18px rgba(255,63,180,.3)}
.plan .rec{display:flex;align-items:center;justify-content:center;gap:var(--s2);padding:var(--s2);font-size:var(--fs-xs);font-weight:800;letter-spacing:.12em;line-height:var(--lh-b);background:linear-gradient(90deg,#ff45b5,#8a3fc0)}
.plan .row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4)}
.plan .rd{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm)}
.plan.sel .rd{border-color:transparent;background:linear-gradient(90deg,#ff45b5,#8a3fc0);background-origin:border-box}
.plan .inf{flex:1;min-width:0}
.plan .pn{font-size:var(--fs-xl);font-weight:800;line-height:var(--lh-h)}
.badge{display:inline-block;background:#b48cf0;color:#2a0f4d;font-weight:800;font-size:var(--fs-sm);line-height:var(--lh-b);border-radius:999px;padding:var(--s1) var(--s3);margin:var(--s2) 0}
.pr{font-size:var(--fs-md);color:var(--mut)}
.pr b{color:#fff;font-size:var(--fs-lg)}
.day{display:flex;align-items:flex-start;line-height:1;font-weight:800}
.day .cur{font-size:var(--fs-lg);margin-top:var(--s2)}
.day .big{font-size:var(--fs-price)}
.day .cts{display:flex;flex-direction:column;font-size:var(--fs-md);margin:var(--s2) 0 0 var(--s1)}
.day .cts small{font-size:var(--fs-sm);font-weight:600;color:var(--mut)}
.cta{flex:1;max-width:var(--w);text-align:center}
.cta .btn{width:100%;max-width:none}
.cancel{color:var(--mut);font-size:var(--fs-sm);margin-top:var(--s2)}

/* age picker */
.age{max-width:var(--w);margin:var(--s6) auto 0;text-align:center}
.age .agel{font-size:var(--fs-xl);font-weight:600;margin-bottom:var(--s4)}
.agerow{display:flex;align-items:center;gap:var(--s1)}
.arw{flex:0 0 36px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;background:none;border:0;color:#cfc3d8;font-size:var(--fs-2xl);cursor:pointer;border-radius:50%}
.arw:active{background:#1c1c1c}
.ages{flex:1;display:flex;align-items:center;min-width:0}
.ages>*{flex:1;min-width:0;text-align:center}
.agen{background:none;border:0;color:#fff;font-weight:700;cursor:pointer;padding:var(--s3) 0;opacity:.3;font-size:var(--fs-xs)}
.agen.d1{opacity:.75;font-size:var(--fs-xl)}.agen.d2{opacity:.55;font-size:var(--fs-md)}.agen.d3{opacity:.4;font-size:var(--fs-sm)}
.agen:active{color:var(--pink)}
.agec{flex:0 0 64px!important;height:64px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xl);font-weight:600;border-radius:20px;border:1px solid var(--pink);
background:linear-gradient(145deg,rgba(255,63,180,.28),rgba(138,63,192,.22));box-shadow:0 0 18px rgba(255,63,180,.25),inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none}
.agex{visibility:hidden}
.d4,.d5{display:none}

/* agreement / payment */
.agree{display:flex;align-items:center;gap:var(--s4);max-width:var(--w);margin:0 auto var(--s5);cursor:pointer;text-align:left}
.agree .cb{flex:0 0 24px;height:24px;border-radius:6px;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--bg)}
.agree.on .cb{background:var(--pink);border-color:var(--pink)}
.agree p{margin:0;font-size:var(--fs-sm);line-height:var(--lh-t);color:var(--mut)}
.agree a{color:#fff;text-decoration:underline}
.card-btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;max-width:var(--w);margin:0 auto var(--s3)}
.card-btn .arr{width:1.3em;height:1.3em;flex:none;animation:arrNudge 1s ease-in-out infinite}
@keyframes arrNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.card-btn .arr{animation:none}}
.crypto{display:flex;align-items:center;justify-content:center;gap:var(--s3);width:100%;max-width:var(--w);margin:0 auto;padding:var(--s3);border:1px solid #3a3a3a;border-radius:16px;background:#2a2a2a;color:#fff;cursor:pointer;text-align:left}
.crypto:active{filter:brightness(.9)}
.card-btn,.crypto,#gph{transition:box-shadow .25s ease,border-color .25s ease}
@media (hover:hover){.card-btn:hover,#gph:hover{box-shadow:0 0 14px rgba(255,69,181,.55),0 0 34px rgba(138,63,192,.45)}
.crypto:hover{border-color:rgba(255,69,181,.6);box-shadow:0 0 14px rgba(255,69,181,.4),0 0 30px rgba(138,63,192,.35)}}
.crypto .bi{display:flex;font-size:var(--fs-2xl)}
.crypto b{display:block;font-size:var(--fs-md);font-weight:700;line-height:var(--lh-h)}
.crypto small{display:block;font-size:var(--fs-sm);color:#a0a4a8;margin-top:2px}
.perks{max-width:var(--w);margin:var(--s5) auto 0;padding:var(--s5);border:1px solid var(--line);border-radius:20px;background:#141414;text-align:left}
.perks h3{margin:0 0 var(--s4);font-size:var(--fs-2xl);font-weight:600;line-height:var(--lh-h)}
.perks ul{list-style:none;margin:0;padding:0}
.perks li{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-md);font-weight:500;line-height:var(--lh-b);padding:var(--s2) 0}
.perks li i{flex:0 0 24px;height:24px;border-radius:50%;background:linear-gradient(90deg,#ff45b5,#8a3fc0);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:var(--fs-sm);font-weight:800;color:#fff}

/* list steps */
.list-options{max-width:var(--w);margin:0 auto;display:flex;flex-direction:column;gap:var(--s3)}
.list-option{width:100%;min-height:56px;padding:var(--s4) var(--s5);border:1px solid #2a2a2a;border-radius:16px;background:#141414;color:#fff;text-align:left;font:600 var(--fs-md)/var(--lh-b) var(--font);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color .12s,transform .12s,background .12s}
.list-option:active{transform:scale(.985)}
.list-option:hover{border-color:#5a2a80}
.list-option.sel{border-color:var(--pink);background:linear-gradient(90deg,rgba(255,63,180,.16),rgba(138,63,192,.12));box-shadow:0 0 0 1px rgba(255,63,180,.12)}
.list-option .num{flex:0 0 32px;color:var(--pink);font-size:var(--fs-xs);font-weight:800}
.list-option .num.emo{font-size:24px;line-height:1;flex:0 0 auto;margin-right:14px}
.list-option .label{flex:1}
.list-option .arrow{display:flex;color:#777;font-size:var(--fs-xl);margin-left:var(--s3)}
.list-option.sel .arrow{color:var(--pink)}

/* card modal */
